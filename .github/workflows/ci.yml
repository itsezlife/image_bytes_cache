name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/image_bytes_cache
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11"
      - run: dart pub get
      - run: dart analyze lib test
      - run: dart test test/unit_test.dart

  flutter:
    name: Flutter adapters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/image_bytes_cache_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
