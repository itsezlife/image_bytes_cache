name: image_bytes_cache_flutter
description: >-
  Flutter paint adapters for image_bytes_cache - widgets that resolve bytes
  via the core ladder.
version: 0.1.0
publish_to: none

homepage: https://github.com/itsezlife/image_bytes_cache
repository: https://github.com/itsezlife/image_bytes_cache
issue_tracker: https://github.com/itsezlife/image_bytes_cache/issues

topics:
  - flutter
  - cache
  - image
  - svg
  - widgets

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.11.0"
  flutter: ">=3.41.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  image_bytes_cache:
    path: ../image_bytes_cache

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.6.0
